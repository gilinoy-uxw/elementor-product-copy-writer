name: Recompile prompt on glossary change

on:
  push:
    paths:
      - 'data/glossary.json'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run compile script
        run: node compile.js

      - name: Commit updated compiled-write.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prompts/compiled-write.txt
          git diff --staged --quiet || git commit -m "chore: recompile prompt from updated glossary"
          git push
